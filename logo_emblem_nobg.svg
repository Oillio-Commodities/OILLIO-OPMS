<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="gG" cx="26%" cy="20%" r="88%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#c0ee28"/>
      <stop offset="28%"  stop-color="#52cc30"/>
      <stop offset="62%"  stop-color="#1e9018"/>
      <stop offset="100%" stop-color="#0b4e08"/>
    </radialGradient>
    <radialGradient id="gY" cx="36%" cy="28%" r="72%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffec50"/>
      <stop offset="36%"  stop-color="#f8b800"/>
      <stop offset="100%" stop-color="#cc5a00"/>
    </radialGradient>
    <radialGradient id="gDk" cx="65%" cy="80%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#052405" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#052405" stop-opacity="0"/>
    </radialGradient>
    <!-- 
      Ring: outer r=96 minus inner circle offset RIGHT by 32px (cx=132) with r=66
      Opening is wider on right, matches real logo
    -->
    <clipPath id="cRing">
      <path d="M100,4 A96,96 0 1,0 100,196 A96,96 0 1,0 100,4 Z
               M132,34 A66,66 0 1,1 132,166 A66,66 0 1,1 132,34 Z"
            fill-rule="evenodd"/>
    </clipPath>
    <clipPath id="cOut"><circle cx="100" cy="100" r="96"/></clipPath>
    <!-- Soft inner edge glow on ring opening (right side) -->
    <radialGradient id="gEdge" cx="85%" cy="50%" r="30%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1e9018" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e9018" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- GREEN CRESCENT RING -->
  <g clip-path="url(#cRing)">
    <circle cx="100" cy="100" r="100" fill="url(#gG)"/>
    <!-- Dark shadow bottom-right of ring -->
    <circle cx="100" cy="100" r="100" fill="url(#gDk)"/>
    <!-- White highlight top-left -->
    <ellipse cx="45" cy="44" rx="28" ry="20" transform="rotate(-38 45 44)"
             fill="white" opacity="0.18"/>
    <!-- Dark curl tips at top and bottom opening -->
    <ellipse cx="138" cy="30"  rx="18" ry="10" transform="rotate(-30 138 30)"  fill="#0a3808" opacity="0.45"/>
    <ellipse cx="136" cy="170" rx="18" ry="10" transform="rotate( 30 136 170)" fill="#0a3808" opacity="0.45"/>
  </g>

  <!-- YELLOW-ORANGE DISC — sits inside ring opening, slightly overlaps left edge -->
  <circle cx="118" cy="100" r="76" fill="url(#gY)" clip-path="url(#cOut)"/>
  <!-- Subtle orange shadow on right of disc -->
  <ellipse cx="168" cy="106" rx="28" ry="42" fill="#993800" opacity="0.18" clip-path="url(#cOut)"/>

  <!-- WHITE LEAF / EYE — at left overlap of ring and disc -->
  <ellipse cx="76" cy="100" rx="15" ry="32"
           transform="rotate(-5 76 100)"
           fill="white" opacity="0.97"/>
</svg>
