<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" overflow="hidden">
<defs>
  <!-- GREEN: bright lime-yellow upper-outer-left → dark forest lower-right (matches Image 4) -->
  <radialGradient id="gG" gradientUnits="userSpaceOnUse" cx="24" cy="18" r="65">
    <stop offset="0%"   stop-color="#a8e040"/>
    <stop offset="18%"  stop-color="#6ecb20"/>
    <stop offset="40%"  stop-color="#28a030"/>
    <stop offset="65%"  stop-color="#107828"/>
    <stop offset="85%"  stop-color="#085018"/>
    <stop offset="100%" stop-color="#043010"/>
  </radialGradient>
  <!-- ORANGE: bright golden-yellow top → rich amber → deep orange bottom-outer -->
  <radialGradient id="gO" gradientUnits="userSpaceOnUse" cx="74" cy="16" r="70">
    <stop offset="0%"   stop-color="#ffe840"/>
    <stop offset="15%"  stop-color="#ffcc00"/>
    <stop offset="35%"  stop-color="#ffb000"/>
    <stop offset="58%"  stop-color="#f07800"/>
    <stop offset="80%"  stop-color="#e05000"/>
    <stop offset="100%" stop-color="#c03400"/>
  </radialGradient>
  <!--
    RING MASK (evenodd):
    Outer circle r=47 centre (50,50)
    MINUS tilted white almond: top-LEFT (46,20) → bottom-RIGHT (54,80)
    The almond creates the central negative space of the torus
  -->
  <mask id="rm">
    <path fill-rule="evenodd" fill="white"
      d="M3,50 A47,47 0 1 0 97,50 A47,47 0 1 0 3,50 Z
         M46,20 C70,26 70,70 54,80 C28,72 28,28 46,20 Z"/>
  </mask>
</defs>
<!-- GREEN fills the LEFT half of the ring -->
<rect x="0" y="0" width="52" height="100" fill="url(#gG)" mask="url(#rm)"/>
<!-- ORANGE fills the RIGHT half of the ring -->
<rect x="48" y="0" width="52" height="100" fill="url(#gO)" mask="url(#rm)"/>
<!-- 3D depth: GREEN wraps over orange at TOP (12 o'clock) -->
<path d="M50,3 A47,47 0 0 0 14,24 L23,37 A31,31 0 0 1 50,22 Z"
      fill="url(#gG)" mask="url(#rm)"/>
<!-- 3D depth: ORANGE wraps over green at BOTTOM (6 o'clock) -->
<path d="M50,97 A47,47 0 0 1 86,76 L77,63 A31,31 0 0 0 50,78 Z"
      fill="url(#gO)" mask="url(#rm)"/>
</svg>
